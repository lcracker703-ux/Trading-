# ─── Watchlist ──────────────────────────────────────────────────────────────
# Any Yahoo Finance symbol works (search finance.yahoo.com to find one):
#   Stocks/ETFs: AAPL, MSFT, SPY, QQQ, VUSA.L (London), NPN.JO (Johannesburg)
#   Crypto:      BTC-USD, ETH-USD, SOL-USD
#   Forex:       EURUSD=X, GBPUSD=X        Gold: GLD
watchlist:
  - AAPL
  - MSFT
  - SPY
  - BTC-USD
  - ETH-USD
  - EURUSD=X
  - GBPUSD=X

# ─── Strategy ───────────────────────────────────────────────────────────────
# sma_trend_buffer (default, recommended): hold while price is above its
#   200-day average; sell only if it closes 3% below it. Aims to sidestep big
#   crashes, not to beat the market. See README for test results.
# Other options: sma_trend, trend_or_dip, golden_cross, momentum_12m,
#   donchian, rsi2_pullback, score
strategy:
  name: sma_trend_buffer

# How much daily history to download (needs at least ~1 year for 200-day rules)
history_period: 2y
