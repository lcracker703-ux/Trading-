name: Backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "How far back to test"
        type: choice
        options: [10y, 5y, 3y, 20y, max]
        default: 10y
      strategy:
        description: "Strategy to test"
        type: choice
        options: [config.yaml setting, sma_trend_buffer, sma_trend, trend_or_dip, golden_cross, momentum_12m, donchian, rsi2_pullback, score]
        default: config.yaml setting
      symbols:
        description: "Symbols to test (space separated). Leave blank for the whole watchlist"
        type: string
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest and send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERIOD: ${{ inputs.period }}
          SYMBOLS: ${{ inputs.symbols }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          ARGS=()
          [ "$STRATEGY" != "config.yaml setting" ] && ARGS+=(--strategy "$STRATEGY")
          python -m trading_signals.backtest $SYMBOLS --period "$PERIOD" "${ARGS[@]}" --telegram
