name: Compare strategies

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Train on data before this date, test on data after it"
        type: string
        default: "2021-01-01"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare all strategies
        env:
          SPLIT: ${{ inputs.split }}
        run: python -m trading_signals.compare --split "$SPLIT"
